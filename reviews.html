<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Reviews | Ludhiana Sweets</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/reviews.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="dashboard.html" class="logo">Ludhiana <span class="gold-text">Admin</span></a>
    <nav>
      <a href="dashboard.html">📊 Overview</a>
      <a href="orders.html">🛒 Orders</a>
      <a href="products.html">📦 Products</a>
      <a href="reviews.html" class="active">⭐ Reviews</a>
    </nav>
    <div style="margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,253,248,.1);">
      <button class="btn btn-outline btn-block" id="logoutBtn" style="color:var(--cream);border-color:rgba(255,253,248,.3);">Sign Out</button>
    </div>
  </aside>
  <div class="admin-main">

    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h1 style="font-size:1.6rem;">Reviews</h1>
      <button class="btn btn-primary" id="toggleAddForm">+ Add Review</button>
    </div>
    <p style="color:rgba(74,44,29,.6);font-size:.9rem;margin:6px 0 16px;">
      Approve or remove customer-submitted reviews below, or add one yourself — reviews you add here go live immediately.
    </p>
    <div class="db-banner" id="dbStatusBanner" style="margin-bottom:20px;"></div>

    <form id="addReviewForm" style="display:none;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-card);padding:24px;margin-bottom:24px;">
      <div class="field">
        <label for="reviewProductSelect">Product</label>
        <select class="input" id="reviewProductSelect"></select>
      </div>
      <div class="field">
        <label for="adminReviewName">Customer Name</label>
        <input class="input" id="adminReviewName" placeholder="e.g. Ayesha K." required />
      </div>
      <div class="field">
        <label>Rating</label>
        <div id="adminStarPicker"></div>
      </div>
      <div class="field">
        <label for="adminReviewComment">Review Text</label>
        <textarea class="input" id="adminReviewComment" rows="3" required></textarea>
      </div>
      <div class="field">
        <label for="adminReviewPhoto">Photo (optional)</label>
        <input type="file" id="adminReviewPhoto" accept="image/*" />
      </div>
      <button type="submit" class="btn btn-gold">Save Review</button>
    </form>

    <div class="review-filter-tabs" style="display:flex;gap:10px;margin-bottom:16px;">
      <button class="btn btn-outline active" data-filter="pending">Pending</button>
      <button class="btn btn-outline" data-filter="approved">Approved</button>
      <button class="btn btn-outline" data-filter="all">All</button>
    </div>

    <div id="reviewsAdminList"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/products-data.js"></script>
<script src="../js/reviews.js"></script>
<script src="../js/admin-reviews.js"></script>
</body>
</html>
