<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Orders | Ludhiana Sweets</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <a href="dashboard.html" class="logo">Ludhiana <span class="gold-text">Admin</span></a>
    <nav>
      <a href="dashboard.html">📊 Overview</a>
      <a href="orders.html" class="active">🛒 Orders</a>
      <a href="products.html">📦 Products</a>
    </nav>
    <div style="margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,253,248,.1);">
      <button class="btn btn-outline btn-block" id="logoutBtn" style="color:var(--cream);border-color:rgba(255,253,248,.3);">Sign Out</button>
    </div>
  </aside>
  <div class="admin-main">

    <h1 style="font-size:1.6rem;">Orders</h1>
    <p style="color:rgba(74,44,29,.6);font-size:.9rem;margin-top:6px;margin-bottom:24px;">
      Orders placed through checkout.html on this browser. Connect a real database to share
      this across devices/staff.
    </p>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="ordersTable">
        <thead><tr><th>Order #</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/admin-data.js"></script>
<script src="../js/admin-orders.js"></script>
</body>
</html>
