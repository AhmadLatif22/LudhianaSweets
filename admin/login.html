<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Ludhiana Sweets Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="login-body">
<div class="login">
  <section class="login-art">
    <img src="../images/logoo.png" alt="Ludhiana Sweets" />
    <div>
      <h2>Run the shop from one place.</h2>
      <p>Orders, stock, products and customer reviews for Ludhiana Sweets, Sargodha.</p>
      <ul id="perks"></ul>
    </div>
    <small>Authorised staff only. Activity on this dashboard is protected by your store’s access list.</small>
  </section>
  <section class="login-form">
    <div class="login-card">
      <h1>Sign in</h1>
      <p>Use your store administrator account.</p>
      <div class="form-err" id="loginError" role="alert" hidden></div>
      <form id="loginForm" novalidate>
        <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="username" required /></div>
        <div class="field"><label for="password">Password</label><div class="pw"><input class="input" id="password" type="password" autocomplete="current-password" required /><button type="button" id="pwToggle" aria-label="Show password"></button></div></div>
        <button class="btn primary" type="submit" id="loginBtn">Sign in</button>
      </form>
    </div>
  </section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/admin-core.js"></script>
<script src="../js/admin-login.js"></script>
</body>
</html>
